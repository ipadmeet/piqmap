<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>位置連動画像アプリ</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
}

#tabs button {
    padding: 10px;
    margin: 5px;
}

.tab {
    display: none;
}

.active {
    display: block;
}

img {
    max-width: 90%;
    margin-top: 10px;
}

#savedGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.saved-img {
    width: 100%;
}
</style>
</head>
<body>

<h2>位置連動アプリ</h2>

<div id="tabs">
    <button onclick="showTab('main')">メイン</button>
    <button onclick="showTab('saved')">保存</button>
</div>

<!-- メイン -->
<div id="main" class="tab active">
    <p>現在地に応じて画像表示</p>
    <img id="displayImage" src="">
</div>

<!-- 保存 -->
<div id="saved" class="tab">
    <h3>保存画像</h3>
    <div id="savedGrid"></div>
</div>

<script>
// 保存データ
let savedImages = JSON.parse(localStorage.getItem("savedImages") || "[]");

// タブ切替
function showTab(tabId){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById(tabId).classList.add("active");
    renderSaved();
}

// グリッド描画
function renderSaved(){
    const grid = document.getElementById("savedGrid");
    grid.innerHTML = "";

    savedImages.forEach((src, index)=>{
        const img = document.createElement("img");
        img.src = src;
        img.className = "saved-img";

        let timer;
        let isTouch = false; // ← 重要（重複防止）

        const start = (e)=>{
            if(e.type === "touchstart"){
                isTouch = true;
            }

            if(e.type === "mousedown" && isTouch){
                return; // タッチ時はマウス無視
            }

            timer = setTimeout(()=>{
                if(confirm("削除しますか？")){
                    savedImages.splice(index,1);
                    localStorage.setItem("savedImages", JSON.stringify(savedImages));
                    renderSaved();
                }
            }, 700);
        };

        const cancel = ()=>{
            clearTimeout(timer);
            isTouch = false;
        };

        img.addEventListener("mousedown", start);
        img.addEventListener("mouseup", cancel);
        img.addEventListener("mouseleave", cancel);

        img.addEventListener("touchstart", start);
        img.addEventListener("touchend", cancel);

        grid.appendChild(img);
    });
}

// ダブルタップ保存
let lastTap = 0;

function handleTap(){
    const now = Date.now();

    if(now - lastTap < 300){
        const img = document.getElementById("displayImage");

        if(img.src && img.src !== window.location.href){
            savedImages.push(img.src);
            localStorage.setItem("savedImages", JSON.stringify(savedImages));

            renderSaved();
            alert("保存しました");
        }
    }

    lastTap = now;
}

const displayImg = document.getElementById("displayImage");
displayImg.addEventListener("click", handleTap);
displayImg.addEventListener("touchend", handleTap);

// GPS
navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const img = document.getElementById("displayImage");

    if(Math.abs(lat-36.4663)<0.001 && Math.abs(lon-140.5883)<0.001){
        img.src = "image1.PNG";
    }
    else if(Math.abs(lat-36.4597)<0.001 && Math.abs(lon-140.5970)<0.001){
        img.src = "image2.PNG";
    }
    else if(Math.abs(lat-36.4054)<0.001 && Math.abs(lon-140.5822)<0.001){
        img.src = "image3.PNG";
    }
    else{
        img.src = "";
    }
},
err=>{
    alert("位置情報が取得できません");
});
</script>

</body>
</html>
