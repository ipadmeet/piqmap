<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>位置連動画像アプリ（複数地点）</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f0f2f5;
}

.tabs {
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}

.tab-btn {
  padding: 10px;
  margin: 5px;
  border: none;
  background: #ccc;
  cursor: pointer;
}

.tab-btn.active {
  background: #007bff;
  color: white;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

img {
  max-width: 90%;
  border-radius: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.grid img {
  width: 100%;
}
</style>
</head>

<body>

<h2>位置連動アプリ</h2>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('main', this)">メイン</button>
  <button class="tab-btn" onclick="switchTab('grid', this)">保存タブ</button>
</div>

<!-- メイン -->
<div id="main" class="tab-content active">
  <p id="status">位置を確認中...</p>
  <img id="mainImage" src="" style="display:none;">
</div>

<!-- 保存 -->
<div id="grid" class="tab-content">
  <h3>保存画像</h3>
  <div id="gridContainer" class="grid"></div>
</div>

<script>
// ================= 設定 =================
const locations = [
  { lat: 36.4663, lng: 140.5883, img: "image1.png" },
  { lat: 36.4597, lng: 140.5970, img: "image2.PNG" },
  { lat: 36.4054, lng: 140.5822, img: "image3.PNG" }
];

const radius = 100;

let lastTap = 0;
let savedImages = [];
let currentImageSrc = "";

// ================= タブ =================
function switchTab(id, btn){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ================= 距離計算 =================
function getDistance(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = x => x*Math.PI/180;

  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);

  const a = Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ================= 位置チェック =================
function checkLocation(pos){
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  let found = false;

  locations.forEach(loc => {
    const d = getDistance(lat, lng, loc.lat, loc.lng);

    if(d <= radius){
      document.getElementById("status").innerText = `到着！(${loc.img})`;

      const img = document.getElementById("mainImage");
      img.src = loc.img;
      img.style.display = "block";

      currentImageSrc = loc.img;
      found = true;
    }
  });

  if(!found){
    document.getElementById("status").innerText = "対象地点外です";
  }
}

// 定期チェック
setInterval(()=>{
  navigator.geolocation.getCurrentPosition(checkLocation);
},5000);

// ================= ダブルタップ =================
document.getElementById("mainImage").addEventListener("click", function(){
  const now = new Date().getTime();
  if(now - lastTap < 300){
    saveImage();
  }
  lastTap = now;
});

// ================= 保存 =================
function saveImage(){
  if (!currentImageSrc) {
    alert("まだ画像が表示されていません");
    return;
  }

  const sourceImg = document.getElementById("mainImage");

  const canvas = document.createElement("canvas");
  canvas.width = sourceImg.naturalWidth;
  canvas.height = sourceImg.naturalHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(sourceImg, 0, 0);

  const dataURL = canvas.toDataURL("image/png");

  savedImages.push(dataURL);
  localStorage.setItem("images", JSON.stringify(savedImages));

  renderImages();
}

// ================= 表示 =================
function renderImages(){
  const grid = document.getElementById("gridContainer");
  grid.innerHTML = "";

  savedImages.forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    grid.appendChild(img);
  });
}

// ================= 初期ロード =================
function loadImages(){
  const data = localStorage.getItem("images");
  if(data){
    savedImages = JSON.parse(data);
    renderImages();
  }
}

loadImages();
</script>

</body>
</html>
