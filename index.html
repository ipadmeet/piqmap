<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PiQMap</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
}

#tabs button {
    padding: 10px;
    margin: 5px;
}

.tab { display: none; }
.active { display: block; }

img {
    max-width: 90%;
    margin-top: 10px;
}

#savedGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.saved-img { width: 100%; }
</style>
</head>
<body>

<h2>PiQMap</h2>

<div id="tabs">
    <button onclick="showTab('main')">Get</button>
    <button onclick="showTab('saved')">Pandas</button>
</div>

<div id="main" class="tab active">
    
    <img id="displayImage" src="">
</div>

<div id="saved" class="tab">
    
    <div id="savedGrid"></div>
</div>

<script>
// =====================
// 座標データ（ここだけ編集すればOK）
// =====================
const locations = [
{lat:36.51234455009052, lon:140.61580074786988, img:"image1.PNG"},
{lat:36.513271792561966, lon:140.61603447231022, img:"image2.PNG"},
{lat:36.513245085434534, lon:140.61584547996083, img:"image3.PNG"},
{lat:36.512598930349405, lon:140.61656212773877, img:"image4.PNG"},
{lat:36.512449776989214, lon:140.61633714719437, img:"image5.PNG"},
{lat:36.51243138819888, lon:140.61619224447082, img:"image6.PNG"},
{lat:36.466283341951694, lon:140.58831299567967, img:"image7.PNG"},
{lat:36.512661233777315, lon:140.6162456079477, img:"image8.PNG"},
{lat:36.512775648210024, lon:140.61653286045507, img:"image9.PNG"},
{lat:36.51297821595828, lon:140.6164741403123, img:"image10.PNG"},
{lat:36.51299410826084, lon:140.6167545628011, img:"image11.PNG"},
{lat:36.513000451529734, lon:140.61636834128714, img:"image12.PNG"},
{lat:36.51293569936873, lon:140.61604656249963, img:"image13.PNG"},
{lat:36.51305673620161, lon:140.61630255150624, img:"image14.PNG"},
{lat:36.513172084651906, lon:140.61627691007047, img:"image15.PNG"},
{lat:36.513384169685125, lon:140.61633219909413, img:"image16.PNG"},
{lat:36.513415918643915, lon:140.61648708075762, img:"image17.PNG"},
{lat:36.51344073132849, lon:140.61685260992806, img:"image18.PNG"},
{lat:36.51348837166392, lon:140.61684396565823, img:"image19.PNG"},
{lat:36.51314000105428, lon:140.6159474312394, img:"image20.PNG"},
{lat:36.51334743559215, lon:140.61615983332496, img:"image21.PNG"},
{lat:36.51359655481083, lon:140.61604869270548, img:"image22.PNG"},

{lat:36.47836996114928, lon:140.57734994952258, img:"image29.PNG"},

{lat:36.48695879241465, lon:140.60706357178495, img:"image34.PNG"}
];

// =====================
// 保存機能
// =====================
let savedImages = JSON.parse(localStorage.getItem("savedImages") || "[]");

function showTab(tabId){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById(tabId).classList.add("active");
    renderSaved();
}

function renderSaved(){
    const grid = document.getElementById("savedGrid");
    grid.innerHTML = "";

    savedImages.forEach((src, index)=>{
        const img = document.createElement("img");
        img.src = src;
        img.className = "saved-img";

        let timer;
        let isTouch = false;

        const start = (e)=>{
            if(e.type === "touchstart") isTouch = true;
            if(e.type === "mousedown" && isTouch) return;

            timer = setTimeout(()=>{
                if(confirm("削除しますか？")){
                    savedImages.splice(index,1);
                    localStorage.setItem("savedImages", JSON.stringify(savedImages));
                    renderSaved();
                }
            },700);
        };

        const cancel = ()=>{
            clearTimeout(timer);
            isTouch = false;
        };

        img.addEventListener("mousedown", start);
        img.addEventListener("mouseup", cancel);
        img.addEventListener("mouseleave", cancel);
        img.addEventListener("touchstart", start);
        img.addEventListener("touchend", cancel);

        grid.appendChild(img);
    });
}

// =====================
// ダブルタップ保存
// =====================
let lastTap = 0;

function handleTap(){
    const now = Date.now();
    if(now - lastTap < 300){
        const img = document.getElementById("displayImage");
        if(img.src){
            savedImages.push(img.src);
            localStorage.setItem("savedImages", JSON.stringify(savedImages));
            renderSaved();
            alert("保存しました");
        }
    }
    lastTap = now;
}

const displayImg = document.getElementById("displayImage");
displayImg.addEventListener("click", handleTap);
displayImg.addEventListener("touchend", handleTap);

// =====================
// GPS判定（最も近い画像を表示）
// =====================
navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    let closest = null;
    let minDist = 999;

    locations.forEach(loc=>{
        const dist = Math.hypot(lat - loc.lat, lon - loc.lon);
        if(dist < minDist){
            minDist = dist;
            closest = loc;
        }
    });

    const img = document.getElementById("displayImage");

    // 半径判定（約100m）
    if(minDist < 0.0005){
        img.src = closest.img;
    }else{
        img.src = "";
    }
});
</script>

</body>
</html>
